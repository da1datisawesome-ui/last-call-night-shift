function sideTable(x,z){box("tableTop",x,.78,z,1.05,.12,.72,M.wood);for(const sx of[-.4,.4])for(const sz of[-.25,.25])box("tableLeg",x+sx,.38,z+sz,.09,.72,.09,M.brass,false)}
for(const x of[-17,-11,-5,1,7,13,19]){sideTable(x,-14.6);cyl("lampBase",x,.91,-14.6,.16,.08,M.brass);cyl("lampShade",x,1.22,-14.6,.27,.42,mat("#ead9b8",.82))}

for(const x of[-8,-5]){box("lobbySofa",x,.62,2.5,2.6,.7,1.0,mat("#38515a",.86));cushion(x,.99,2.5,2.35,.82)}
function roomDress(z){box("nightstand",17,.68,z-1.2,1.0,1.1,.72,M.wood);cyl("lamp",17,.95,z-1.2,.11,.3,M.brass);box("lampshade",17,1.22,z-1.2,.38,.35,.38,mat("#e8d7b7",.82));box("pillow",14.05,1.05,z-.18,1.05,.18,.58,mat("#f4efe6",.92));box("throw",16.25,1.02,z+.25,1.55,.08,1.2,mat("#5c7180",.9));box("bench",17.2,.58,z+2.2,2.0,.42,.62,mat("#7d583b",.55));box("curtain",12.95,2.35,z-2.2,.08,3.1,2.2,mat("#7a4c45",.88))}
for(const z of[-13,-5,3,11,-1,7,15])roomDress(z);

// Premium corridor dressing: continuous guest circulation, repeated architectural rhythm and layered practical lighting.
const runnerMat=mat("#574039",.88,0);
for(let z=-15;z<=15;z+=2.5){
  box("corridorRunner",0,.012,z,3.25,.035,2.15,runnerMat,false);

}
for(let z=-15;z<=15;z+=4){
  box("corridorWallPanelL",-21.78,2.0,z, .06,3.0,3.25,mat("#8f7356",.65),false);
  box("corridorWallPanelR",21.78,2.0,z, .06,3.0,3.25,mat("#8f7356",.65),false);
  const wl=new THREE.PointLight(0xffc994,1.05,6); wl.position.set(-20.8,2.55,z); scene.add(wl);

  box("ceilingPanel",0,4.02,z,3.7,.045,3.4,mat("#2d3438",.35,.2),false);

function roomCard(id,z,unlocked){
  const base=unlocked?"#183c48":"#392c2a";
  box("roomCard",4.8,2.55,z-.2,1.45,.62,.06,mat(base,.38),false);
  label((unlocked?"ROOM ":"LOCKED • ")+id,4.8,2.58,z-.28,.22);
}
for(const [id,z] of [[101,-13],[102,-5],[103,3],[104,11],[105,-1],[106,7],[107,15]]) roomCard(id,z,id<=103);

// State
const rooms=new Map([101,102,103,104,105,106,107].map(id=>[id,{id,unlocked:id<=103,state:"available",guest:null,dirty:false}]));
const guests=[{name:"Alex",id:1,state:"waiting",room:null,color:0xd88765},{name:"Jordan",id:2,state:"idle",room:null,color:0x7b9fc0},{name:"Taylor",id:3,state:"idle",room:null,color:0x9b77a8}];
let money=1280,rep=1,carrying=null,serviceTarget=null,cleaningTarget=null,task="Guest waiting at reception",lastSave=0;
const save=()=>{localStorage.setItem("lcn-save",JSON.stringify({money,rep,rooms:[...rooms.values()].map(r=>({id:r.id,unlocked:r.unlocked,state:r.state,dirty:r.dirty}),)}));toast("Game saved")};
const saved=JSON.parse(localStorage.getItem("lcn-save")||"null");if(saved){money=saved.money??money;rep=saved.rep??rep;(saved.rooms||[]).forEach(x=>{const r=rooms.get(x.id);if(r){r.unlocked=x.unlocked;r.state=x.state;r.dirty=x.dirty}})}
const moneyEl=document.getElementById("money"),repEl=document.getElementById("rep"),taskEl=document.getElementById("task"),prompt=document.getElementById("prompt"),use=document.getElementById("use"),toastEl=document.getElementById("toast");
function ui(){moneyEl.textContent="$"+money.toLocaleString();repEl.textContent="★ "+rep;taskEl.textContent=task;document.getElementById("controlsHint").textContent=carrying?"CARRYING: "+carrying.toUpperCase()+"  •  MOVE: left joystick  •  LOOK: right side":"MOVE: left joystick  •  LOOK: right side  •  WALK TO THE HIGHLIGHTED TASK"}
function setTask(t){task=t;ui()}function toast(t){toastEl.textContent=t;toastEl.style.display="block";clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.style.display="none",1800)}
function firstRoom(){return [...rooms.values()].find(r=>r.unlocked&&r.state==="available"&&!r.dirty)}
function guestMesh(g){const group=new THREE.Group();group.position.set(-7.4,0,6.5);const suit=mat("#"+g.color.toString(16).padStart(6,"0"),.72);const skin=mat("#b87858",.86);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,6,14),suit);body.position.y=1.02;const head=new THREE.Mesh(new THREE.SphereGeometry(.30,20,16),skin);head.position.y=1.78;group.add(body,head);scene.add(group);return group}
async function loadCharacter(g){
  if(!loader)return;
  try{
    const src=await new Promise((res,rej)=>loader.load("https://raw.githubusercontent.com/pj4533/slopmancer/c0b535e9d90dfccaaef1e8bff12e56d514f7700e/public/assets/models/characters/Casual_Male.gltf",res,undefined,rej));
    const model=src.scene.clone(true);
    model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material&&o.material.map)o.material.map.colorSpace=THREE.SRGBColorSpace}});
    const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),height=Math.max(size.y,.01);
    const scale=1.78/height;
    model.scale.setScalar(scale);
    const b2=new THREE.Box3().setFromObject(model),center=b2.getCenter(new THREE.Vector3());
    model.position.y-=b2.min.y;
    model.position.x-=center.x;
    model.position.z-=center.z;
    const old=g.mesh,p=old.position.clone(),vis=old.visible;
    scene.remove(old);
    g.mesh=model;g.mesh.position.copy(p);g.mesh.visible=vis;g.mesh.userData.assetReady=true;scene.add(g.mesh);
    if(src.animations?.length){
      g.mixer=new THREE.AnimationMixer(g.mesh);
      const idle=src.animations.find(a=>/idle/i.test(a.name))||src.animations[0];
      g.action=g.mixer.clipAction(idle);g.action.play();
    }
  }catch(e){console.warn("character asset skipped",e)}
}
guests.forEach(g=>g.mesh=guestMesh(g));guests[0].mesh.visible=true;guests[1].mesh.visible=false;guests[2].mesh.visible=false;
let luggage=null;function faceGuest(g,targetX,targetZ){
  if(!g.mesh)return;
  g.mesh.rotation.y=Math.atan2(targetX-g.mesh.position.x,targetZ-g.mesh.position.z);
}
function spawnGuest(){if(guests.some(g=>g.state==="waiting"||g.state==="luggage"))return;const g=guests.find(x=>x.state==="idle");if(!g)return;g.state="waiting";g.room=null;g.mesh.position.set(-7.4,0,6.5);g.mesh.visible=true;setTask("🔑 CURRENT TASK: Check in "+g.name+" at reception")}
function checkIn(g){const r=firstRoom();if(!r){toast("No clean unlocked rooms available");return}r.state="occupied";r.guest=g;g.room=r.id;g.state="luggage";money+=100;rep++;luggage=box("luggage",-7.5,.55,5,.7,1,.5,M.blue);setTask("🧳 CURRENT TASK: Pick up luggage for Room "+r.id+" at reception");toast("+$100 • Guest checked in");ui()}
function pickupLuggage(){if(!luggage)return;carrying="luggage";scene.remove(luggage);luggage=null;setTask("🧳 CURRENT TASK: Walk to Room "+guests.find(g=>g.state==="luggage").room+" and deliver the luggage")}
function deliverLuggage(){const g=guests.find(x=>x.state==="luggage"&&x.room);if(!g||carrying!=="luggage")return;carrying=null;g.state="staying";g.mesh.position.set(5.0,0,g.room===101?-13:g.room===102?-5:g.room===103?3:g.room===104?11:g.room===105?-1:g.room===106?7:15);g.mesh.rotation.y=Math.PI;g.mesh.visible=true;setTask("Guest in Room "+g.room+" • stay in progress");toast("Luggage delivered manually");setTimeout(()=>{if(g.state==="staying"){g.state="service";serviceTarget=g;setTask("🍽️ CURRENT TASK: Collect room service in the kitchen, then deliver to Room "+g.room)}},6500)}
function collectService(){if(!serviceTarget||carrying)return;carrying="roomservice";setTask("🍽️ CURRENT TASK: Carry room service to Room "+serviceTarget.room);toast("Room service collected")}
function deliverService(){if(carrying!=="roomservice"||!serviceTarget)return;carrying=null;serviceTarget.state="staying";setTask("Room Service delivered to Room "+serviceTarget.room);money+=40;rep++;toast("+$40 • Room service delivered");ui();setTimeout(()=>{if(serviceTarget){serviceTarget.state="checkout";setTask("Guest in Room "+serviceTarget.room+" is checking out")}},5500)}
function collectClean(){if(carrying||!cleaningTarget)return;carrying="cleaning";setTask("🧹 CURRENT TASK: Carry cleaning supplies to Room "+cleaningTarget.id);toast("Cleaning supplies collected")}
function clean(){if(carrying!=="cleaning"||!cleaningTarget)return;carrying=null;cleaningTarget.dirty=false;cleaningTarget.state="available";cleaningTarget=null;money+=55;rep++;setTask("Room cleaned • ready for next guest");toast("+$55 • Room cleaned");ui()}
function finishCheckout(){const g=guests.find(x=>x.state==="checkout");if(!g)return;const r=rooms.get(g.room);if(!r)return;r.state="dirty";r.dirty=true;g.state="idle";g.room=null;serviceTarget=null;cleaningTarget=r;setTask("🧹 CURRENT TASK: Collect cleaning supplies for Room "+r.id);toast("Guest checked out • room needs cleaning");ui();setTimeout(spawnGuest,1800)}

// Interaction zones are proximity-based; actions never move the player.
const zones=[
 {name:"Reception",pos:new THREE.Vector3(-10,1.2,5),range:2.8,action:()=>{const g=guests.find(x=>x.state==="waiting");if(g)checkIn(g)},label:"🔑 CHECK IN GUEST"},
 {name:"Luggage",pos:new THREE.Vector3(-7.5,1,5),range:2.2,action:pickupLuggage,label:"🧳 PICK UP LUGGAGE"},
 {name:"Kitchen",pos:new THREE.Vector3(-12,1,-11),range:3,action:collectService,label:"🍽️ COLLECT ROOM SERVICE"},
 {name:"Housekeeping",pos:new THREE.Vector3(-1,1,-11),range:3,action:collectClean,label:"🧹 COLLECT CLEANING SUPPLIES"},
];
function roomZone(){if(carrying==="luggage"){const g=guests.find(x=>x.state==="luggage");if(g)return {pos:new THREE.Vector3(4.8,1,g.room===101?-13:g.room===102?-5:g.room===103?3:11),range:3,action:deliverLuggage,label:"🧳 DELIVER LUGGAGE"}}
if(carrying==="roomservice"&&serviceTarget){const rz={101:-13,102:-5,103:3,104:11,105:-1,106:7,107:15}[serviceTarget.room];return {pos:new THREE.Vector3(4.8,1,rz),range:3,action:deliverService,label:"🍽️ DELIVER ROOM SERVICE"}}
if(carrying==="cleaning"&&cleaningTarget){const z=cleaningTarget.id===101?-13:cleaningTarget.id===102?-5:cleaningTarget.id===103?3:cleaningTarget.id===104?11:cleaningTarget.id===105?-1:cleaningTarget.id===106?7:15;return {pos:new THREE.Vector3(4.8,1,z),range:3,action:clean,label:"🧹 CLEAN ROOM "+cleaningTarget.id}}
return null}
function nearest(){let best=null,bd=999;for(const z of zones){const d=camera.position.distanceTo(z.pos);if(d<z.range&&d<bd){if(z.name==="Reception"&&!guests.some(g=>g.state==="waiting"))continue;if(z.name==="Luggage"&&!luggage)continue;if(z.name==="Kitchen"&&(!serviceTarget||carrying))continue;if(z.name==="Housekeeping"&&(!cleaningTarget||carrying))continue;best=z;bd=d}}const rz=roomZone();if(rz){const d=camera.position.distanceTo(rz.pos);if(d<rz.range&&d<bd)best=rz}return best}

// Manual movement and collision
const keys={};let joyX=0,joyY=0,yaw=0,pitch=0,lastLook=null,joyActive=false;
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key==="Escape")openMenu()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const joy=document.getElementById("joy"),stick=document.getElementById("stick");
function joyMove(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.min(48,Math.hypot(x,y)),ang=Math.atan2(y,x);joyX=Math.cos(ang)*m/48;joyY=Math.sin(ang)*m/48;stick.style.transform="translate("+joyX*38+"px,"+joyY*38+"px)"}
function joyStart(e){joyActive=true;if(joy.setPointerCapture)joy.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault()}
function joyEnd(){joyActive=false;joyX=joyY=0;stick.style.transform=""}
joy.addEventListener("pointerdown",joyStart);joy.addEventListener("pointermove",e=>{if(joyActive)joyMove(e)});joy.addEventListener("pointerup",joyEnd);joy.addEventListener("pointercancel",joyEnd);joy.addEventListener("lostpointercapture",joyEnd);
const look=document.getElementById("look");
function lookStart(e){if(e.pointerType==="mouse"&&e.button!==0)return;lastLook={x:e.clientX,y:e.clientY};if(look.setPointerCapture)look.setPointerCapture(e.pointerId);e.preventDefault()}
function lookMove(e){if(!lastLook)return;const dx=e.clientX-lastLook.x,dy=e.clientY-lastLook.y;lastLook={x:e.clientX,y:e.clientY};yaw-=dx*.006;pitch=Math.max(-1.15,Math.min(1.15,pitch-dy*.0045))}
function lookEnd(){lastLook=null}
look.addEventListener("pointerdown",lookStart);look.addEventListener("pointermove",lookMove);look.addEventListener("pointerup",lookEnd);look.addEventListener("pointercancel",lookEnd);look.addEventListener("lostpointercapture",lookEnd);
function blocked(x,z){
  if(x<-21.15||x>21.15||z<-16.15||z>16.15)return true;
  if(x>-16.8&&x<-9.5&&z>3.8&&z<6.7)return true;
  if(x>-14.6&&x<-9.2&&z>-12.9&&z<-10.0)return true;
  if(x>-3.6&&x<1.5&&z>-12.9&&z<-10.0)return true;
  // Guest-room thresholds: the corridor is open, but solid frontage begins away from each doorway.
  const doors=[-13,-5,3,11,-1,7,15];
  const nearDoor=doors.some(z0=>Math.abs(z-z0)<1.05);
  if(x>5.85&&!nearDoor)return true;
  if(x<-5.85&&!nearDoor)return true;
  return false;
}
function move(dt){
  let f=joyY*-1+(keys.w?1:0)-(keys.s?1:0),r=joyX+(keys.d?1:0)-(keys.a?1:0),l=Math.hypot(f,r)||1;
  f/=l;r/=l;const sp=3.5*dt,dx=(Math.sin(yaw)*f+Math.cos(yaw)*r)*sp,dz=(Math.cos(yaw)*f-Math.sin(yaw)*r)*sp;
  const p=camera.position,nx=p.x+dx,nz=p.z+dz;
  if(!blocked(nx,p.z))p.x=nx;
  if(!blocked(p.x,nz))p.z=nz;
}
function openMenu(){document.getElementById("panel").style.display="flex";panelBody();}function panelBody(){document.getElementById("panelTitle").textContent="Night Shift";document.getElementById("panelBody").innerHTML='<div class="row"><b>Hotel funds</b><span>$'+money.toLocaleString()+'</span></div><div class="row"><b>Reputation</b><span>★ '+rep+'</span></div><div class="row"><b>Room 101–103</b><span>Unlocked</span></div><div class="row"><b>Next room upgrade</b><span>$2,000 • +1 room</span><button class="action" id="upgrade">UPGRADE</button></div><div class="row"><b>Save</b><span>Save current night</span><button class="action" id="save">SAVE</button></div><div class="row"><b>Manual gameplay</b><span>No teleportation</span></div>';document.getElementById("upgrade").onclick=()=>{if(money>=2000&&!rooms.get(104).unlocked){money-=2000;rooms.get(104).unlocked=true;toast("Room 104 unlocked");ui();panelBody()}else toast("Need $2,000")};document.getElementById("save").onclick=save}
document.getElementById("menu").onclick=openMenu;document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";document.getElementById("use").onclick=()=>{const z=nearest();if(z)z.action()};
let lastCheckoutId=0;
function tickGuests(){const g=guests.find(x=>x.state==="checkout");if(g&&g.id!==lastCheckoutId){lastCheckoutId=g.id;finishCheckout()}if(!guests.some(x=>x.state==="waiting"||x.state==="luggage")&&guests.some(x=>x.state==="idle"))spawnGuest()}
let started=false;document.getElementById("start").addEventListener("click",()=>{started=true;document.getElementById("title").style.display="none";spawnGuest();setTask("🔑 CURRENT TASK: Check in Alex at reception")});
let last=performance.now();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(started){move(dt);camera.rotation.set(pitch,yaw,0,"YXZ");for(const g of guests)if(g.mixer)g.mixer.update(dt);hands.rotation.y=0;const z=nearest();if(z){prompt.textContent=z.label;prompt.style.display="block";use.style.display="block"}else{prompt.style.display="none";use.style.display="none"}if(now-lastSave>15000){lastSave=now;localStorage.setItem("lcn-save",JSON.stringify({money,rep,rooms:[...rooms.values()].map(r=>({id:r.id,unlocked:r.unlocked,state:r.state,dirty:r.dirty}))}))}tickGuests()}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
ui();
</script></body></html>
