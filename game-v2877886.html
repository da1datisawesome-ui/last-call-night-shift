<script>
(function(){
 window.addEventListener("error",function(e){
   const t=document.getElementById("title");
   if(t&&t.style.display!=="none"){
     const p=t.querySelector(".titleBox p");
     if(p){p.textContent="STARTUP ERROR: "+(e.message||"JavaScript initialization failed")+" — tap PLAY again after the fix.";p.style.color="#ffb4b4";}
   }
   console.error("Last Call global error",e.message,e.filename,e.lineno,e.colno);
 });
 window.addEventListener("unhandledrejection",function(e){
   const msg=e.reason&&e.reason.message?e.reason.message:String(e.reason);
   const t=document.getElementById("title"),p=t&&t.querySelector(".titleBox p");
   if(p){p.textContent="STARTUP ERROR: "+msg;p.style.color="#ffb4b4";}
   console.error("Last Call unhandled rejection",e.reason);
 });
 function wireTitle(){
   const play=document.getElementById("play"),settings=document.getElementById("titleSettings");
   if(play&&!play.dataset.wired){
     play.dataset.wired="1";
     play.addEventListener("click",function(e){
       e.preventDefault(); e.stopPropagation();
       if(typeof window.beginGame==="function") window.beginGame();
       else window.__lastCallStartQueued=true;
     },{passive:false});
   }
   if(settings&&!settings.dataset.wired){
     settings.dataset.wired="1";
     settings.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();window.dispatchEvent(new Event("lastcall-settings"));},{passive:false});
   }
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wireTitle,{once:true});else wireTitle();
})();
</script>

 if(type==="staff")card.innerHTML='<h2>Staff</h2><p>Earn money from hotel work to unlock new staff roles.</p><div class="staffGrid">'+Object.entries(unlock).map(([n,v])=>'<div class="staff '+(v?'':'locked')+'"><b>'+n+'</b><div class="mini">'+(v?'Unlocked':'Locked — earn more hotel income')+'</div></div>').join("")+'</div><button class="btn close" id="close">Back</button>';
 if(type==="upgrades")card.innerHTML='<h2>Hotel Upgrades</h2><p>Starting capacity: 3 rooms. Guest Room upgrades unlock reserved rooms along the main corridor.</p><div class="staff"><b>Guest Rooms</b><div class="mini">Capacity '+roomCapacity+' rooms</div><button class="btn alt" id="buyRooms">'+(ROOM_UPGRADE_COSTS[upgradeRooms]!==undefined?"Unlock reserved rooms  •  $"+ROOM_UPGRADE_COSTS[upgradeRooms].toLocaleString():"Fully upgraded")+'</button></div><div class="staff"><b>Kitchen & Room Service</b><div class="mini">Unlocks room-service work</div><button class="btn alt" id="buyKitchen">$3,500</button></div><div class="staff"><b>Maintenance Wing</b><div class="mini">Unlocks maintenance work</div><button class="btn alt" id="buyMaintenance">$5,000</button></div><button class="btn close" id="close">Back</button>';
 if(type==="menu"){document.getElementById("resume").onclick=()=>panel.style.display="none";document.getElementById("staff").onclick=()=>openPanel("staff");document.getElementById("upgrades").onclick=()=>openPanel("upgrades");document.getElementById("settings").onclick=()=>openPanel("settings")}
 if(type==="settings"){document.getElementById("close").onclick=()=>panel.style.display="none";document.getElementById("mv").oninput=e=>music.volume=+e.target.value;document.getElementById("av").oninput=e=>ambience.volume=+e.target.value}
 if(type==="staff"||type==="upgrades")document.getElementById("close").onclick=()=>openPanel("menu");
 if(type==="upgrades"){document.getElementById("buyRooms").onclick=()=>{if(roomUpgrade())openPanel("upgrades")};document.getElementById("buyKitchen").onclick=()=>{if(facilityUpgrade("Kitchen & Room Service",3500))openPanel("upgrades")};document.getElementById("buyMaintenance").onclick=()=>{if(facilityUpgrade("Maintenance Wing",5000))openPanel("upgrades")}}
}
document.getElementById("menu").onclick=()=>openPanel("menu");
document.getElementById("titleSettings").onclick=()=>openPanel("settings");
addEventListener("lastcall-settings",()=>openPanel("settings"));
document.addEventListener("visibilitychange",()=>{if(document.hidden){music.pause();ambience.pause()}else if(playing&&audioOn)startAudio()});
resize();positionActors();
</script>
</div>
</body>
</html>
