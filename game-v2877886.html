function interactAt(x,y){
 let best=null,bd=.19;
 hotelGuests.forEach(g=>{if(g.npc.el.style.display!=="none"){const d=Math.hypot(px-g.npc.x,py-g.npc.y);if(d<bd){if(g.status==="waiting"){best={type:"checkin",g};bd=d}else if(g.status==="staying"&&g.serviceRequested){best={type:"service",g};bd=d}}}});
 if(luggageState&&luggageState.active){const d=Math.hypot(px-luggageState.x,py-luggageState.y);if(d<bd){best={type:"luggage",l:luggageState};bd=d}}
 guestRooms.forEach(rm=>{const rp=roomPoint(rm),d=Math.hypot(px-rp.x,py-rp.y);if(d<bd){if(carrying==="luggage"&&luggageState&&luggageState.room===rm.id)best={type:"deliver",rm};else if(rm.state==="dirty")best={type:"clean",rm};if(best)bd=d}});
 if(!best){showToast("Move closer to the current task");return false}
 if(best.type==="checkin")return checkInGuest(best.g);
 if(best.type==="luggage"){if(!carrying){carrying="luggage";best.l.active=false;best.l.el.style.display="none";setHotelTask("🧳 Take luggage to Room "+best.l.room);showToast("Luggage picked up");positionActors();return true}}
 if(best.type==="deliver")return deliverLuggage(best.rm);
 if(best.type==="service")return deliverRoomService(best.g);
 if(best.type==="clean")return cleanRoom(best.rm);
 return false;
}

function pointer(e){
 const r=world.parentElement.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function nudge(dx,dy){if(!playing)return;moveClamped(px+dx,py+dy);positionActors()}
addEventListener("keydown",e=>{
 if(!playing)return;
 const k=e.key.toLowerCase(),stepSize=.018;
 if(["arrowup","w"].includes(k)){e.preventDefault();nudge(0,-stepSize)}
 if(["arrowdown","s"].includes(k)){e.preventDefault();nudge(0,stepSize)}
 if(["arrowleft","a"].includes(k)){e.preventDefault();nudge(-stepSize,0)}
 if(["arrowright","d"].includes(k)){e.preventDefault();nudge(stepSize,0)}
 if(k==="e")interactAt(px,py);
});
function screenToWorld(p){
 return{
  x:Math.max(0,Math.min(1,((p.x-worldTransform.x)/worldTransform.zoom-worldLeft)/worldW)),
  y:Math.max(0,Math.min(1,((p.y-worldTransform.y)/worldTransform.zoom-worldTop)/worldH))
 }
}
let touchDrag=false,touchLastX=0,touchLastY=0,touchMoved=false,touchLastTime=0;
world.addEventListener("pointerdown",e=>{
 if(!playing)return;
 touchDrag=true;touchMoved=false;touchLastX=e.clientX;touchLastY=e.clientY;touchLastTime=performance.now();
 world.setPointerCapture?.(e.pointerId);
});
world.addEventListener("pointermove",e=>{
 if(!playing||!touchDrag)return;
 const now=performance.now(),dt=Math.max(8,Math.min(50,now-touchLastTime));
 let dx=e.clientX-touchLastX,dy=e.clientY-touchLastY;
 touchLastX=e.clientX;touchLastY=e.clientY;touchLastTime=now;
 if(Math.abs(dx)+Math.abs(dy)>1)touchMoved=true;
 const zoom=worldTransform.zoom||1;
 const maxWorldStep=0.020*(dt/16.67);
 const wx=Math.max(-maxWorldStep,Math.min(maxWorldStep,dx/(zoom*worldW)));
 const wy=Math.max(-maxWorldStep,Math.min(maxWorldStep,dy/(zoom*worldH)));
 if(wx||wy){player.classList.add("walking");moveClamped(px+wx,py+wy);positionActors();}
});
world.addEventListener("pointerup",e=>{
 if(!touchDrag)return;
 player.classList.remove("walking");
 touchDrag=false;
 if(!touchMoved){
  const p=screenToWorld(pointer(e)),q=nearestInteractable(p.x,p.y);
  if(q)interactAt(q.x,q.y);
 }
});
world.addEventListener("pointercancel",()=>{touchDrag=false;player.classList.remove("walking")});

try{buildLevel(Date.now()>>>0)}catch(err){console.error("Initial level build failed",err)}
window.beginGame=function(){
 if(playing)return true;
 const title=document.getElementById("title"),playBtn=document.getElementById("play");
 if(playBtn){playBtn.disabled=true;playBtn.textContent="LOADING SHIFT…";}
 try{
  levelSeed=(Date.now()>>>0)^Math.floor(Math.random()*0xffffffff);
  buildLevel(levelSeed);
  resetGeneratedActors();
  money=1280;earned=0;rep=50;occupiedRooms=0;checkIns=0;carrying=null;luggageState=null;
  moneyEl.textContent="$1,280";
  setHotelTask("Guest waiting at reception");
  px=GENERATED_POINTS.reception.x;py=GENERATED_POINTS.reception.y;
  camera.x=px;camera.y=py;
  playing=true;
  positionActors();
  updateWorld();
  title.style.display="none";title.style.visibility="hidden";title.style.pointerEvents="none";
  hint.classList.add("show");setTimeout(()=>hint.classList.remove("show"),3500);
  startAudio();
  requestAnimationFrame(loop);
  return true;
 }catch(err){
  playing=false;
  if(playBtn){playBtn.disabled=false;playBtn.textContent="▶ PLAY / CONTINUE";}
  title.style.display="flex";title.style.visibility="visible";title.style.pointerEvents="auto";
  console.error("Last Call startup error",err);
  showToast("Startup error: "+(err&&err.message?err.message:"unknown"));
  return false;
 }
}
if(window.__lastCallStartQueued)window.beginGame();
document.getElementById("sound").onclick=toggleAudio;
function openPanel(type){
 const panel=document.getElementById("panel"),card=document.getElementById("panelCard");panel.style.display="flex";
 if(type==="menu")card.innerHTML='<h2>Menu</h2><p>Keep the shift simple.</p><button class="btn" id="resume">Back to Game</button><button class="btn alt" id="staff">Staff</button><button class="btn alt" id="upgrades">Hotel Upgrades</button><button class="btn alt" id="settings">Settings</button>';
 if(type==="settings")card.innerHTML='<h2>Settings</h2><div class="row"><span>Music</span><input id="mv" class="range" type="range" min="0" max="1" step=".05" value="'+music.volume+'"></div><div class="row"><span>Ambience</span><input id="av" class="range" type="range" min="0" max="1" step=".05" value="'+ambience.volume+'"></div><button class="btn close" id="close">Back</button>';
 if(type==="staff")card.innerHTML='<h2>Staff</h2><p>Earn money from hotel work to unlock new staff roles.</p><div class="staffGrid">'+Object.entries(unlock).map(([n,v])=>'<div class="staff '+(v?'':'locked')+'"><b>'+n+'</b><div class="mini">'+(v?'Unlocked':'Locked — earn more hotel income')+'</div></div>').join("")+'</div><button class="btn close" id="close">Back</button>';
 if(type==="upgrades")card.innerHTML='<h2>Hotel Upgrades</h2><p>Starting capacity: 3 rooms. Each Guest Rooms purchase adds 2 rooms.</p><div class="staff"><b>Guest Rooms</b><div class="mini">Capacity '+roomCapacity+' rooms</div><button class="btn alt" id="buyRooms">'+(ROOM_UPGRADE_COSTS[upgradeRooms]!==undefined?"Expand +2 rooms  •  $"+ROOM_UPGRADE_COSTS[upgradeRooms].toLocaleString():"Fully upgraded")+'</button></div><div class="staff"><b>Kitchen & Room Service</b><div class="mini">Unlocks room-service work</div><button class="btn alt" id="buyKitchen">$3,500</button></div><div class="staff"><b>Maintenance Wing</b><div class="mini">Unlocks maintenance work</div><button class="btn alt" id="buyMaintenance">$5,000</button></div><button class="btn close" id="close">Back</button>';
 if(type==="menu"){document.getElementById("resume").onclick=()=>panel.style.display="none";document.getElementById("staff").onclick=()=>openPanel("staff");document.getElementById("upgrades").onclick=()=>openPanel("upgrades");document.getElementById("settings").onclick=()=>openPanel("settings")}
 if(type==="settings"){document.getElementById("close").onclick=()=>panel.style.display="none";document.getElementById("mv").oninput=e=>music.volume=+e.target.value;document.getElementById("av").oninput=e=>ambience.volume=+e.target.value}
 if(type==="staff"||type==="upgrades")document.getElementById("close").onclick=()=>openPanel("menu");
 if(type==="upgrades"){document.getElementById("buyRooms").onclick=()=>{if(roomUpgrade())openPanel("upgrades")};document.getElementById("buyKitchen").onclick=()=>{if(facilityUpgrade("Kitchen & Room Service",3500))openPanel("upgrades")};document.getElementById("buyMaintenance").onclick=()=>{if(facilityUpgrade("Maintenance Wing",5000))openPanel("upgrades")}}
}
document.getElementById("menu").onclick=()=>openPanel("menu");
document.getElementById("titleSettings").onclick=()=>openPanel("settings");
addEventListener("lastcall-settings",()=>openPanel("settings"));
document.addEventListener("visibilitychange",()=>{if(document.hidden){music.pause();ambience.pause()}else if(playing&&audioOn)startAudio()});
resize();positionActors();
</script>
</div>
